apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "llama-cpp.fullname" . }}-models
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "llama-cpp.labels" . | nindent 4 }}
  annotations:
    # Prevent helm uninstall from deleting downloaded models.
    helm.sh/resource-policy: keep
spec:
  accessModes:
    - {{ .Values.models.pvc.accessMode }}
  resources:
    requests:
      storage: {{ .Values.models.pvc.size }}
  {{- if .Values.models.pvc.storageClass }}
  storageClassName: {{ .Values.models.pvc.storageClass }}
  {{- end }}
