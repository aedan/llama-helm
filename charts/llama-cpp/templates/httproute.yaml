{{- if .Values.gateway.enabled }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "llama-cpp.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "llama-cpp.labels" . | nindent 4 }}
spec:
  parentRefs:
    - name: {{ required "gateway.name is required when gateway.enabled=true — set it to the name of your existing Gateway resource" .Values.gateway.name }}
      namespace: {{ .Values.gateway.namespace | default .Release.Namespace }}
      sectionName: {{ printf "%s-https" (include "llama-cpp.fullname" .) }}
  hostnames:
    - {{ required "gateway.hostname must be set" .Values.gateway.hostname | quote }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: {{ include "llama-cpp.fullname" . }}-coordinator
          port: {{ .Values.coordinator.service.port }}
{{- end }}
