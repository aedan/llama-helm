{{- $allModels := concat .Values.models.library (default (list) .Values.models.extra) }}
{{- if $allModels }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "llama-cpp.fullname" . }}-model-loader
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "llama-cpp.labels" . | nindent 4 }}
    app.kubernetes.io/component: model-loader
  annotations:
    # Runs after every install/upgrade; previous Job is cleaned up first.
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-delete-policy: before-hook-creation
    helm.sh/hook-weight: "0"
    # Allow 24 h for large model downloads before helm considers this a failure.
    helm.sh/hook-timeout: "86400"
spec:
  # 24-hour deadline to accommodate large models on slow links.
  activeDeadlineSeconds: 86400
  backoffLimit: 3
  template:
    metadata:
      labels:
        {{- include "llama-cpp.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: model-loader
    spec:
      restartPolicy: OnFailure

      securityContext:
        runAsNonRoot: true
        runAsUser: 100
        # fsGroup causes kubelet to chown the volume to this GID and add g+w,
        # allowing the curl user (uid=100) to write to the root-owned PVC mount.
        fsGroup: 100
        seccompProfile:
          type: RuntimeDefault

      nodeSelector:
        {{- toYaml .Values.nodeSelector | nindent 8 }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}

      containers:
        - name: downloader
          image: curlimages/curl:8.7.1
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          command:
            - /bin/sh
            - -c
            - |
              set -e
              ERRORS=0

              {{- range $allModels }}
              DEST="/models/{{ .filename }}"
              if [ -f "$DEST" ]; then
                echo "[SKIP] {{ .name }} already present"
              else
                echo "[DOWN] {{ .name }} -> $DEST"
                mkdir -p /models
                if curl -fSL --retry 5 --retry-delay 15 \
                     -H "Authorization: Bearer ${HF_TOKEN}" \
                     -o "${DEST}.tmp" \
                     "{{ .url }}"; then
                  mv "${DEST}.tmp" "$DEST"
                  echo "[OK]   {{ .name }}"
                else
                  echo "[FAIL] {{ .name }}" >&2
                  rm -f "${DEST}.tmp"
                  ERRORS=$((ERRORS + 1))
                fi
              fi
              {{- end }}

              if [ "$ERRORS" -gt 0 ]; then
                echo "$ERRORS model(s) failed to download." >&2
                exit 1
              fi
              echo "All models ready."

          env:
            - name: HF_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "llama-cpp.secretName" . }}
                  key: HF_TOKEN
                  optional: true

          resources:
            requests:
              cpu: "1"
              memory: "256Mi"
            limits:
              cpu: "2"
              memory: "512Mi"

          volumeMounts:
            - name: model-store
              mountPath: /models

      volumes:
        - name: model-store
          persistentVolumeClaim:
            claimName: {{ include "llama-cpp.fullname" . }}-models
{{- end }}
