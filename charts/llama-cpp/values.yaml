# Default values for the llama-cpp Helm chart.
# Targets x86_64 CPU-only nodes (no GPU).
# Multi-node layer distribution uses the llama.cpp RPC backend:
#   - rpcWorker   DaemonSet runs llama-rpc-server on every labelled node
#   - coordinator Deployment runs llama-server; it discovers workers at startup
#     and connects to them via --rpc, distributing transformer layers across nodes.

nameOverride: ""
fullnameOverride: ""

# ── Image ──────────────────────────────────────────────────────────────────
image:
  repository: ghcr.io/aedan/llama-cpp
  pullPolicy: IfNotPresent
  # Overrides Chart.appVersion when set.
  tag: ""

# Image used by the coordinator init container to discover RPC pod IPs.
kubectlImage:
  repository: bitnami/kubectl
  tag: "latest"
  pullPolicy: IfNotPresent

# ── Node targeting ─────────────────────────────────────────────────────────
# All pods (workers and coordinator) are scheduled only on nodes carrying
# this label.  Label a node with: kubectl label node <name> llama.cpp=enabled
nodeSelector:
  "llama.cpp": "enabled"

tolerations: []

affinity: {}

# ── RPC Worker (DaemonSet) ─────────────────────────────────────────────────
rpcWorker:
  port: 50052

  # CPU threads the RPC server uses for tensor ops on this node.
  # 0 = let the OS scheduler decide (uses all available cores).
  threads: 0

  resources:
    requests:
      cpu: "8"
      memory: "32Gi"
    limits:
      cpu: "32"
      memory: "128Gi"

# ── Coordinator (llama-server) ─────────────────────────────────────────────
coordinator:
  replicas: 1

  resources:
    requests:
      cpu: "4"
      memory: "4Gi"
    limits:
      cpu: "8"
      memory: "16Gi"

  service:
    type: ClusterIP
    port: 80

# ── Model management ───────────────────────────────────────────────────────
# Models are downloaded to the PVC by a post-install/post-upgrade Job.
# Files already present on the PVC are never re-downloaded (idempotent).
# The coordinator waits for models.active to appear before starting.
#
# To add a model:    helm upgrade <release> . --set 'models.library[N].name=...'
# To switch models:  helm upgrade <release> . --set models.active=new-model.gguf
models:
  # Filename (under /models/) that llama-server loads.
  # Must match the filename of one entry in .library (or be pre-existing on the PVC).
  active: ""

  # Library of models to download.  Each entry is downloaded once by the
  # model-loader Job; re-running helm upgrade with the same entry is a no-op.
  library: []
  # Example:
  # library:
  #   - name: llama-3-8b-q4                 # human label (for your reference)
  #     filename: llama-3-8b-q4.gguf        # saved as /models/<filename>
  #     url: "https://huggingface.co/bartowski/Meta-Llama-3-8B-Instruct-GGUF/resolve/main/Meta-Llama-3-8B-Instruct-Q4_K_M.gguf"
  #   - name: mistral-7b-q4
  #     filename: mistral-7b-q4.gguf
  #     url: "https://huggingface.co/TheBloke/Mistral-7B-Instruct-v0.2-GGUF/resolve/main/mistral-7b-instruct-v0.2.Q4_K_M.gguf"

  pvc:
    # Size to accommodate your full model library.  A 70B Q4_K_M is ~42 GiB.
    size: "200Gi"
    storageClass: ""
    accessMode: ReadWriteOnce

# ── llama-server parameters ────────────────────────────────────────────────
server:
  host: "0.0.0.0"
  port: "8080"

  # Context window in tokens.
  ctxSize: "4096"

  # Number of parallel request slots (one KV-cache copy each).
  parallelSlots: "4"

  # Prompt evaluation batch size.
  batchSize: "512"

  # CPU threads for the coordinator's own prompt/generation work.
  # The heavy tensor compute happens on the RPC workers.
  threads: "4"

  # KV-cache quantization.  q8_0 cuts memory ~2x vs f16 with negligible loss.
  kvCacheType: "q8_0"

  # Enable flash attention (reduces memory bandwidth pressure on CPU).
  flashAttn: true

  # Arbitrary extra args appended to the llama-server command.
  # Example: ["--log-verbosity", "1", "--metrics"]
  extraArgs: []

# ── Gateway API (Envoy) ────────────────────────────────────────────────────
gateway:
  enabled: false

  # Name of the existing Gateway resource in the cluster.
  # Required when enabled=true.
  # Find yours with: kubectl get gateways -A
  name: ""

  # Namespace the Gateway lives in.  Defaults to the release namespace.
  namespace: ""

  # Listener section name on the Gateway to attach to.
  # Common values: "https", "http", "web".
  # Check with: kubectl get gateway <name> -o yaml | grep name:
  listenerName: "https"

  hostname: "llama.api.ord.cloudmunchers.net"

# ── Secrets ────────────────────────────────────────────────────────────────
# HF_TOKEN is only needed for gated/private HuggingFace models.
# Create externally (recommended):
#
#   kubectl create secret generic <release>-llama-cpp-credentials \
#     --namespace <namespace> \
#     --from-literal=HF_TOKEN='hf_...'
#
# Or let the chart create one (dev/test only — token stored in Helm release):
secrets:
  create: false
  hfToken: ""
